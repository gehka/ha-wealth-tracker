# ---------------------------------------------------------------------------
# Waveshare ESP32-S3-Touch-AMOLED-1.64 as a PoE loot-tracker display.
#
# Pulls its data from the `wealthyexile` Home Assistant custom integration
# (see ../custom_components/wealthyexile) over the native API -- this device
# never talks to WealthyExile or the internet directly, only to HA on the
# local network.
#
# Hardware wiring (from Waveshare's own reference firmware,
# github.com/waveshareteam/ESP32-S3-Touch-AMOLED-1.64-v2,
# Arduino/examples/06_LVGL_Test/lcd_config.h and
# Arduino/examples/02_I2C_QMI8658/i2c_bsp.cpp):
#   Display QSPI (CO5300): CS=GPIO46 CLK=GPIO10 D0=GPIO11 D1=GPIO12
#                           D2=GPIO13 D3=GPIO14 RESET=GPIO21
#   I2C (touch)           : SDA=GPIO47 SCL=GPIO48
#   Touch (FT3168)        : address 0x38, no RST/INT lines broken out
#
# UNVERIFIED / needs checking against real hardware before the gift is
# wrapped:
#   - Waveshare's own reference code has no LCD-enable pin for this board
#     (unlike the related 1.43" board, which needs one). If the screen
#     stays black, check the schematic under docs.waveshare.com for one.
#   - Touch calibration below assumes a 1:1 raw-to-pixel mapping with no
#     axis swap/invert; this is the most common gotcha on these boards and
#     may need adjusting once touch is live.
#   - Substitutions below use the `wealthyexile` integration's fixed,
#     predictable entity IDs (see custom_components/wealthyexile/sensor.py)
#     and should work out of the box on any fresh install -- but worth one
#     quick check under Developer Tools > States after first setup, in
#     case something else on that HA instance already collided with one of
#     those IDs.
#   - Not flashed/tested on real hardware (no device available in the dev
#     environment this was written in) -- `esphome config` validates
#     cleanly and a full `esphome compile` was kicked off, but display and
#     touch behavior can only really be confirmed on the actual board.
#
# Deliberately left out of this v1 (see the project plan for why):
#   - The total-value sparkline/chart from the original Reddit project:
#     dropped by choice, not just technical limitation -- the owner decided
#     a stack of single-purpose, swipeable pages (one number each) reads
#     better on a small screen than a crammed chart+numbers combo.
#   - The per-tab breakdown screen: those sensors are created dynamically
#     with entity IDs that depend on your brother's actual stash tabs, so
#     they can't be wired into a YAML that has to compile before his
#     account exists on this install. Still available as normal HA
#     sensors/attributes for dashboards -- just not laid out on-device yet.
#   - The "Top Stacks" page: dropped by choice, same reasoning as the
#     chart above (owner wants fewer, more focused pages).
#
# Screen layout: four single-purpose pages, swipe left/right to move
# between them -- Rate, Wealth, Session, Ratio. Rate and Session turn
# green/+ when positive and red/- when negative. The Divine Orb's own
# icon (pulled from the same CDN WealthyExile itself serves it from --
# see the `image:` block below) stands in for the word "Divine"
# wherever a unit label would otherwise just repeat it.
# ---------------------------------------------------------------------------

esphome:
  name: wealthyexile-display
  friendly_name: PoE Loot Tracker

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # No separate OTA password: the api encryption key above already
    # authenticates uploaders, so a second password just costs flash/RAM.

logger:

external_components:
  # FT3168 touch driver -- not in ESPHome core, pulled from a community
  # repo for a closely related Waveshare AMOLED board. If this repo ever
  # disappears, vendor the `components/ft3168` folder locally instead.
  - source: github://koshg28/ESPHA
    components: [ft3168]

substitutions:
  # These are fixed, predictable entity IDs: the wealthyexile integration
  # pins them via `suggested_object_id` (see custom_components/wealthyexile/
  # sensor.py) specifically so they're the same on *any* installation of
  # it, not derived from a random per-install config entry ID or device
  # name. That's what makes it possible to bake entity IDs into this
  # firmware at compile time, before the person who'll actually use it has
  # set up the integration on their own HA instance -- normally you'd have
  # to check Developer Tools > States after setup and edit these, but here
  # they should already be correct out of the box.
  #
  # Only breaks if something else on that HA instance already occupies one
  # of these object IDs (another WealthyExile config entry, or a leftover
  # orphaned entity registry entry from a previous attempt) -- HA would
  # then suffix a "_2" and these constants would be wrong. Worth a quick
  # check under Developer Tools > States after first setup, once, just in
  # case.
  total_value_entity: sensor.wealthyexile_wealth
  divines_per_hour_entity: sensor.wealthyexile_divines_per_hour
  divine_price_entity: sensor.wealthyexile_divine_price
  session_gain_entity: sensor.wealthyexile_session_gain
  # Any entity backed by the wealthyexile coordinator works here -- HA's
  # CoordinatorEntity treats a per-entity update_entity call as a request
  # to refresh the whole shared coordinator, so this doubles as "refresh
  # everything now". Note the integration only *reads* WealthyExile's
  # current state (see custom_components/wealthyexile/api.py) -- it never
  # triggers a new stash sync. So this button means "check what
  # WealthyExile already knows, right now" rather than "sync the game
  # right now"; the actual sync still has to happen on wealthyexile.com
  # (or however WealthyExile syncs during a play session).
  refresh_target_entity: sensor.wealthyexile_wealth
  swipe_threshold_px: "40"

i2c:
  id: bus_i2c
  sda: GPIO47
  scl: GPIO48
  frequency: 400kHz
  scan: true

spi:
  id: bus_qspi
  type: quad
  clk_pin: GPIO10
  data_pins: [GPIO11, GPIO12, GPIO13, GPIO14]

display:
  - platform: mipi_spi
    id: amoled
    model: CO5300
    spi_id: bus_qspi
    cs_pin: GPIO46
    reset_pin: GPIO21
    dimensions:
      width: 280
      height: 456
    data_rate: 40MHz
    spi_mode: MODE0
    color_order: rgb
    invert_colors: false
    brightness: 180
    auto_clear_enabled: false
    update_interval: never

image:
  # Divine and Chaos Orb's actual in-game icons, fetched once at build
  # time from GGG's own CDN (the Divine path matches what WealthyExile
  # itself serves as the wealthyexile_top_stack_1 entity_picture while
  # that slot held a Divine Orb stack). Two sizes of the Divine icon:
  # "_lg" sits inline next to the big 48px numbers on Wealth/Session/Rate,
  # the small one pairs with the smaller numbers on the Ratio page
  # alongside the Chaos icon.
  - platform: file
    id: icon_divine_lg
    file: "https://web.poecdn.com/image/Art/2DItems/Currency/CurrencyModValues.png"
    resize: 44x44
    type: RGB565
    transparency: alpha_channel
  - platform: file
    id: icon_divine_sm
    file: "https://web.poecdn.com/image/Art/2DItems/Currency/CurrencyModValues.png"
    resize: 30x30
    type: RGB565
    transparency: alpha_channel
  - platform: file
    id: icon_chaos_sm
    file: "https://web.poecdn.com/image/Art/2DItems/Currency/CurrencyRerollRare.png"
    resize: 30x30
    type: RGB565
    transparency: alpha_channel

touchscreen:
  - platform: ft3168
    id: touch
    i2c_id: bus_i2c
    address: 0x38
    display: amoled
    calibration:
      x_min: 0
      x_max: 279
      y_min: 0
      y_max: 455
    # The display is logically rotated 90 degrees (see `rotation: 90`
    # above) to go landscape, but the touch controller still reports raw
    # coordinates in the panel's native portrait orientation -- this
    # transform remaps raw touch into the rotated logical space so touch
    # position lines up with what's drawn on screen. swap_xy/mirror_y is
    # the standard combination for a 90-degree rotation, but this is
    # UNVERIFIED against real hardware; if touch feels offset or mirrored
    # once landscape is live, try toggling mirror_x/mirror_y here first.
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true
    # Swipe distance (both axes) is tracked in on_update (the only trigger
    # that gets live touch coordinates) into globals, then acted on in
    # on_release (which fires once with no touch data of its own).
    # Horizontal swipe = page navigation; vertical downward swipe = force
    # a refresh (pull-to-refresh), replacing the old corner button, which
    # was both hard to hit and showed a glyph the default LVGL font
    # doesn't have.
    on_update:
      - lambda: |-
          if (touches.empty()) return;
          id(swipe_dx) = (int) touches[0].x - (int) touches[0].x_org;
          id(swipe_dy) = (int) touches[0].y - (int) touches[0].y_org;
    on_release:
      - if:
          condition:
            lambda: |-
              return abs(id(swipe_dx)) >= atoi("${swipe_threshold_px}") &&
                     abs(id(swipe_dx)) > abs(id(swipe_dy));
          then:
            - if:
                condition:
                  lambda: "return id(swipe_dx) < 0;"
                then:
                  - lvgl.page.next:
                      animation: OUT_LEFT
                      time: 200ms
                else:
                  - lvgl.page.previous:
                      animation: OUT_RIGHT
                      time: 200ms
          else:
            - if:
                condition:
                  lambda: |-
                    return id(swipe_dy) >= atoi("${swipe_threshold_px}") &&
                           abs(id(swipe_dy)) > abs(id(swipe_dx));
                then:
                  - homeassistant.service:
                      service: homeassistant.update_entity
                      data:
                        entity_id: ${refresh_target_entity}
                  # Reset the elapsed counter right away rather than
                  # waiting for the raw string to change -- otherwise a
                  # manual refresh that finds no new WealthyExile data
                  # (the common case) looks completely inert: spinner
                  # spins, but "Last sync" doesn't move at all.
                  - lambda: |-
                      id(elapsed_since_sync) = 0;
                  - lvgl.widget.show: refresh_spinner
                  - delay: 1200ms
                  - lvgl.widget.hide: refresh_spinner
      - lambda: |-
          id(swipe_dx) = 0;
          id(swipe_dy) = 0;

globals:
  - id: swipe_dx
    type: int
    restore_value: false
    initial_value: "0"
  - id: swipe_dy
    type: int
    restore_value: false
    initial_value: "0"
  # Last-sync display is relative ("12s", "4m", "> 10m"), not a clock
  # timestamp -- a fixed HH:MM barely changes within a play session and
  # is useless for confirming a refresh actually did something. Rather
  # than parsing WealthyExile's ISO8601 string against wall-clock time
  # (needs its own `time:` component plus timezone handling), this just
  # counts seconds since the raw string last *changed*. Simpler and
  # avoids a timezone dependency, at the cost of one inaccuracy: right
  # after a reboot/reflash it starts ticking from 0 even if the cached
  # value is actually older -- self-corrects at the next real sync.
  - id: elapsed_since_sync
    type: int
    restore_value: false
    initial_value: "0"
  - id: last_sync_raw
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: last_sync_display
    type: std::string
    restore_value: false
    initial_value: '"Last sync --"'

# --- Data pulled from Home Assistant (the wealthyexile integration) --------

sensor:
  - platform: homeassistant
    id: ha_total_value
    entity_id: ${total_value_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_total_value
          text: !lambda 'return std::isnan(x) ? "--" : str_sprintf("%.1f", x);'

  - platform: homeassistant
    id: ha_divines_per_hour
    entity_id: ${divines_per_hour_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_rate_value
          text: !lambda 'return std::isnan(x) ? "--" : str_sprintf("%+.2f", x);'
          text_color: !lambda |-
            if (std::isnan(x)) return lv_color_hex(0x888888);
            return x >= 0 ? lv_color_hex(0x4CAF50) : lv_color_hex(0xFF5252);

  - platform: homeassistant
    id: ha_divine_price
    entity_id: ${divine_price_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_ratio_value
          text: !lambda 'return std::isnan(x) ? "--" : str_sprintf("%.0f", x);'

  - platform: homeassistant
    id: ha_session_gain
    entity_id: ${session_gain_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_session_value
          text: !lambda 'return std::isnan(x) ? "--" : str_sprintf("%+.1f", x);'
          text_color: !lambda |-
            if (std::isnan(x)) return lv_color_hex(0x888888);
            return x >= 0 ? lv_color_hex(0x4CAF50) : lv_color_hex(0xFF5252);

text_sensor:
  # WealthyExile's own "last synced" timestamp (when the game itself last
  # pushed fresh data to WealthyExile) -- not the same as when this
  # device last polled HA. Shown on every page so a pull-down-to-refresh
  # has something visible to check against: if the elapsed counter below
  # doesn't reset after a refresh, it means WealthyExile genuinely has
  # nothing newer yet, not that the gesture failed. Only reacts to the
  # raw ISO8601 string actually *changing* -- see `elapsed_since_sync`.
  - platform: homeassistant
    id: ha_last_synced
    entity_id: sensor.wealthyexile_last_synced
    internal: true
    on_value:
      - lambda: |-
          if (x != id(last_sync_raw)) {
            id(last_sync_raw) = x;
            id(elapsed_since_sync) = 0;
          }

interval:
  - interval: 1s
    then:
      - lambda: |-
          int e = ++id(elapsed_since_sync);
          char buf[24];
          if (e < 60) {
            snprintf(buf, sizeof(buf), "Last sync %ds", e);
          } else if (e < 600) {
            snprintf(buf, sizeof(buf), "Last sync %dm", e / 60);
          } else {
            snprintf(buf, sizeof(buf), "Last sync > 10m");
          }
          id(last_sync_display) = std::string(buf);
      - lvgl.label.update: {id: lbl_last_sync_rate, text: !lambda 'return id(last_sync_display);'}
      - lvgl.label.update: {id: lbl_last_sync_wealth, text: !lambda 'return id(last_sync_display);'}
      - lvgl.label.update: {id: lbl_last_sync_session, text: !lambda 'return id(last_sync_display);'}
      - lvgl.label.update: {id: lbl_last_sync_ratio, text: !lambda 'return id(last_sync_display);'}

# --- Screens -----------------------------------------------------------

lvgl:
  rotation: 90
  touchscreens:
    - touch
  # A single spinner on LVGL's top layer (renders above whatever page is
  # active, so it doesn't need to be duplicated per page). Shown briefly
  # on every pull-down-to-refresh so the gesture has visible confirmation
  # even when the underlying values don't change -- see the touchscreen
  # on_release handler below.
  top_layer:
    widgets:
      - spinner:
          id: refresh_spinner
          x: 10
          y: 10
          width: 28
          height: 28
          spin_time: 1s
          arc_length: 60deg
          indicator:
            arc_color: 0x66CCFF
          hidden: true
  pages:
    - id: page_rate
      bg_color: 0x000000
      widgets:
        - label:
            text: "DIVINES / HOUR"
            text_color: 0x888888
            align: TOP_MID
            y: 30
        - obj:
            width: 260
            height: 60
            align: CENTER
            bg_opa: 0%
            border_width: 0
            pad_all: 0
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 8
            widgets:
              - label:
                  id: lbl_rate_value
                  text: "--"
                  text_font: montserrat_48
                  text_color: 0x888888
              - image:
                  src: icon_divine_lg
              - label:
                  text: "/ h"
                  text_color: 0xAAAAAA
        - label:
            id: lbl_last_sync_rate
            text: "Last sync --"
            text_font: montserrat_14
            text_color: 0x555555
            align: CENTER
            y: 110

    - id: page_wealth
      bg_color: 0x000000
      widgets:
        - label:
            text: "WEALTH"
            text_color: 0x888888
            align: TOP_MID
            y: 30
        - obj:
            width: 260
            height: 60
            align: CENTER
            bg_opa: 0%
            border_width: 0
            pad_all: 0
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 10
            widgets:
              - label:
                  id: lbl_total_value
                  text: "--"
                  text_font: montserrat_48
                  text_color: 0xFFFFFF
              - image:
                  src: icon_divine_lg
        - label:
            id: lbl_last_sync_wealth
            text: "Last sync --"
            text_font: montserrat_14
            text_color: 0x555555
            align: CENTER
            y: 110

    - id: page_session
      bg_color: 0x000000
      widgets:
        - label:
            text: "THIS SESSION"
            text_color: 0x888888
            align: TOP_MID
            y: 30
        - obj:
            width: 260
            height: 60
            align: CENTER
            bg_opa: 0%
            border_width: 0
            pad_all: 0
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 10
            widgets:
              - label:
                  id: lbl_session_value
                  text: "--"
                  text_font: montserrat_48
                  text_color: 0x888888
              - image:
                  src: icon_divine_lg
        - label:
            id: lbl_last_sync_session
            text: "Last sync --"
            text_font: montserrat_14
            text_color: 0x555555
            align: CENTER
            y: 110

    - id: page_ratio
      bg_color: 0x000000
      widgets:
        - label:
            text: "EXCHANGE RATE"
            text_color: 0x888888
            align: TOP_MID
            y: 30
        - obj:
            width: 320
            height: 50
            align: CENTER
            bg_opa: 0%
            border_width: 0
            pad_all: 0
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 10
            widgets:
              - image:
                  src: icon_chaos_sm
              - label:
                  id: lbl_ratio_value
                  text: "--"
                  text_font: montserrat_32
                  text_color: 0xFFFFFF
              - label:
                  text: ":"
                  text_font: montserrat_32
                  text_color: 0xAAAAAA
              - label:
                  text: "1"
                  text_font: montserrat_32
                  text_color: 0xFFFFFF
              - image:
                  src: icon_divine_sm
        - label:
            id: lbl_last_sync_ratio
            text: "Last sync --"
            text_font: montserrat_14
            text_color: 0x555555
            align: CENTER
            y: 110
